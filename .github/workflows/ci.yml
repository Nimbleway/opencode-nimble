name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      # Fails if the package would ship without its entry.
      - run: pnpm pack --dry-run | grep -q dist/index.js

      # Fails if package.json exports don't resolve to a built entry with the plugin's default export.
      - run: node --input-type=module -e 'const m = await import("@nimble-way/opencode"); if (m.default?.id !== "nimble") process.exit(1)'
